# Aetheris Android - Gradle Build Properties
# SPDX-License-Identifier: AGPL-3.0

# Gradle JVM Memory
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m

# Kotlin Daemon Memory - prevent OOM during compilation
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC

# Parallel execution
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.daemon.idlet.timeout=1800000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Compose
kotlin.compose.compilerReports=true
